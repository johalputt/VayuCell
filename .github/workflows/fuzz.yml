# SPDX-License-Identifier: Apache-2.0
#
# Fuzzing the three places a string this project did not write becomes a
# decision it acts on.
#
# A short run on every push, a long one on a schedule. The short run is not
# there to find bugs — sixty seconds finds almost nothing — it is there so the
# harness cannot rot: a fuzz target that stopped compiling six months ago is
# indistinguishable from one nobody ever wrote, and the scheduled run that would
# have noticed is the one nobody reads the logs of.

name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "13 4 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fuzz:
    name: "Fuzz · ${{ matrix.target }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [request_line, battery_reading, nonce]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # cargo-fuzz needs nightly for the sanitizer instrumentation. This is the
      # only place in the project that does, and it builds nothing that ships.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz

      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2
        with:
          tool: cargo-fuzz

      - name: Fuzz ${{ matrix.target }}
        env:
          # Sixty seconds on a push, five minutes on a schedule, whatever was
          # asked for on a manual run.
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || (github.event_name == 'schedule' && '300' || '60') }}
        run: |
          # --target is explicit and load-bearing. cargo-fuzz infers its default
          # target from the triple of its own binary, and the installer resolves
          # to a musl build — so the default becomes x86_64-unknown-linux-musl,
          # whose statically linked libc AddressSanitizer cannot instrument:
          # "sanitizer is incompatible with statically linked libc". Naming the
          # gnu target is what makes the sanitizer usable, and the failure it
          # avoids is a build error rather than a silently uninstrumented run.
          cargo fuzz run "${{ matrix.target }}" \
            --target x86_64-unknown-linux-gnu -- \
            -max_total_time="$SECONDS_PER_TARGET" -print_final_stats=1

      - name: Keep whatever crashed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
