# SPDX-License-Identifier: Apache-2.0
#
# Release: build for every target this actually runs on, sign, publish.
#
# The whole argument of this project is that you can check what you are running.
# A release that cannot be verified independently — no signature, no SBOM, no
# reproducible rebuild — asks for exactly the trust the project claims not to
# need. So every artefact here is signed with a keyless certificate tied to this
# workflow, and the SBOM ships beside it.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:

  # ── The tag must agree with what is in the tree ─────────────────────────────
  preflight:
    name: "Release · Preflight"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Version consistency and release notes
        # --releasing additionally requires [Unreleased] to be empty. That is a
        # tag-time requirement, not a push-time one: notes accumulate there
        # between releases, and a gate forbidding that makes the section useless.
        run: bash scripts/release-gate.sh --releasing
      - name: Settle on one version, from the tree
        id: version
        # `.release-version` is the single source of truth in both directions.
        #
        # On a tag push the ref must agree with it — a tag that does not match
        # the tree is a release whose artefacts cannot be matched back to their
        # source. On a manual dispatch there is no tag yet, so the version comes
        # from the file and the publish step creates the tag from it; the two
        # then agree by construction rather than by anybody remembering. The
        # manual path is not a convenience: pushing a tag is not always available
        # to the person cutting the release, and a release process with exactly
        # one route is a release process that stops when that route closes.
        run: |
          set -euo pipefail
          file="$(tr -d '\n' < .release-version)"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            [ "$GITHUB_REF_NAME" = "$file" ] || {
              echo "tag $GITHUB_REF_NAME does not match .release-version $file"
              exit 1
            }
            echo "tag and .release-version agree at $file"
          else
            # The release gate already refused to run if this tag exists, so
            # reaching here means the version has not been published before.
            echo "manual dispatch; releasing $file from the tree"
          fi
          echo "version=$file" >> "$GITHUB_OUTPUT"

  # ── Build every target the project claims to support ───────────────────────
  build:
    name: "Release · ${{ matrix.target }}"
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Cross-linker for this target
        # Until this step existed the release built the *library* and shipped
        # `.rlib` files. An rlib is not something a person can run, so the
        # installer never found a usable build and every single install fell
        # back to compiling from source on the phone — twenty minutes, on a
        # device chosen for being old. Producing a binary means linking, and
        # linking for a target that is not this runner means a cross-linker.
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            *-linux-android*)
              # Preinstalled on the runner image. Discovered rather than
              # hardcoded, because the NDK revision moves and a stale path
              # would fail deep inside cargo with a linker error nobody can read.
              ndk="${ANDROID_NDK_ROOT:-${ANDROID_NDK_LATEST_HOME:-}}"
              [ -n "$ndk" ] || { echo "no Android NDK on this runner"; exit 1; }
              bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
              [ -d "$bin" ] || { echo "NDK present but no prebuilt toolchain at $bin"; exit 1; }
              # API 24 is Android 7, which is what docs/INSTALL.md asks for. The
              # two numbers have to agree or the guide promises a phone the
              # binary refuses to start on.
              case "${{ matrix.target }}" in
                aarch64-linux-android)   cc="$bin/aarch64-linux-android24-clang" ;;
                armv7-linux-androideabi) cc="$bin/armv7a-linux-androideabi24-clang" ;;
                *) echo "unhandled android target"; exit 1 ;;
              esac
              [ -x "$cc" ] || { echo "no such linker: $cc"; ls "$bin" | head -40; exit 1; }
              ;;
            aarch64-unknown-linux-gnu)
              sudo apt-get update -qq
              sudo apt-get install -y gcc-aarch64-linux-gnu
              cc=aarch64-linux-gnu-gcc
              ;;
            armv7-unknown-linux-gnueabihf)
              sudo apt-get update -qq
              sudo apt-get install -y gcc-arm-linux-gnueabihf
              cc=arm-linux-gnueabihf-gcc
              ;;
            x86_64-unknown-linux-gnu)
              cc=cc
              ;;
            *) echo "unhandled target ${{ matrix.target }}"; exit 1 ;;
          esac
          # CARGO_TARGET_<TRIPLE>_LINKER, with the triple upper-cased and dashes
          # turned into underscores.
          var="CARGO_TARGET_$(printf '%s' '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')_LINKER"
          echo "$var=$cc" >> "$GITHUB_ENV"
          echo "linking ${{ matrix.target }} with $cc"

      - name: Build the binary
        # --locked so the release resolves exactly the dependency graph that was
        # reviewed, and remapped paths so the build directory does not leak into
        # the artefact and break reproducibility.
        env:
          RUSTFLAGS: "-D warnings --remap-path-prefix=${{ github.workspace }}=/build"
        run: cargo build --release --locked -p vayucell --target ${{ matrix.target }}

      - name: Package and checksum
        # One tarball per target, named for the target, because that name is the
        # contract install.sh downloads against. scripts/install-gate.sh checks
        # the two agree — this pair drifting apart is what shipped rlibs.
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/vayucell"
          [ -f "$bin" ] || { echo "no binary produced for ${{ matrix.target }}"; exit 1; }
          file "$bin"
          mkdir -p dist
          # Fixed mtime and sorted entries: a tarball carrying the build time is
          # a tarball that cannot be reproduced, and reproducibility is a claim
          # this project makes out loud.
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime='UTC 2020-01-01' \
              -czf "dist/vayucell-${{ matrix.target }}.tar.gz" \
              -C "target/${{ matrix.target }}/release" vayucell
          ( cd dist && sha256sum ./* > "SHA256SUMS-${{ matrix.target }}.txt" )
          cat "dist/SHA256SUMS-${{ matrix.target }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # ── Sign and publish ───────────────────────────────────────────────────────
  publish:
    name: "Release · Sign and publish"
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Job-scoped, and this is the floor rather than a preference: creating a
    # release IS a write to repository contents, and keyless signing IS the
    # exchange of an OIDC identity token. A supply-chain scanner will report
    # both as write permissions and it is right to; the answer is that they are
    # confined to the one job that publishes, and every other job in this
    # workflow inherits the top-level `contents: read`.
    permissions:
      contents: write   # to create the release
      id-token: write   # for keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: staging
      - name: Flatten and re-checksum
        run: |
          mkdir -p dist
          find staging -type f ! -name 'SHA256SUMS-*' -exec cp {} dist/ \;
          ( cd dist && sha256sum ./* > SHA256SUMS.txt )
          cat dist/SHA256SUMS.txt

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the checksum file
        # One signature over the checksum file rather than one per artefact:
        # the checksums already bind every file, and a verifier has one thing to
        # check instead of a list they might not finish.
        run: |
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.txt.sig \
            --output-certificate dist/SHA256SUMS.txt.pem \
            dist/SHA256SUMS.txt

      - name: Generate the SBOM
        # No `|| true`. A release that silently ships without its bill of
        # materials is the unverifiable artefact this workflow exists to
        # prevent, and swallowing the error is how that happens quietly.
        run: |
          cargo install cargo-cyclonedx --locked
          bash scripts/sbom.sh dist/sbom.cdx.json
          ls -la dist/

      - name: How to verify this release
        run: |
          {
            echo "## Verifying this release"
            echo
            echo '```bash'
            echo "cosign verify-blob \\"
            echo "  --certificate SHA256SUMS.txt.pem \\"
            echo "  --signature SHA256SUMS.txt.sig \\"
            echo "  --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  SHA256SUMS.txt"
            echo
            echo "sha256sum -c SHA256SUMS.txt"
            echo '```'
            echo
            echo "The certificate is keyless and bound to this workflow. There is no"
            echo "private key to steal, and nothing to trust that you cannot check."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # Named explicitly rather than inherited from the ref, so the tag-push
          # and manual-dispatch paths publish under exactly the same name. On a
          # dispatch this is what creates the tag, at the commit that was built.
          tag_name: ${{ needs.preflight.outputs.version }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
