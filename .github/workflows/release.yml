# SPDX-License-Identifier: Apache-2.0
#
# Release: build for every target this actually runs on, sign, publish.
#
# The whole argument of this project is that you can check what you are running.
# A release that cannot be verified independently — no signature, no SBOM, no
# reproducible rebuild — asks for exactly the trust the project claims not to
# need. So every artefact here is signed with a keyless certificate tied to this
# workflow, and the SBOM ships beside it.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:

  # ── The tag must agree with what is in the tree ─────────────────────────────
  preflight:
    name: "Release · Preflight"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Version consistency and release notes
        # --releasing additionally requires [Unreleased] to be empty. That is a
        # tag-time requirement, not a push-time one: notes accumulate there
        # between releases, and a gate forbidding that makes the section useless.
        run: bash scripts/release-gate.sh --releasing
      - name: The tag must match .release-version
        # A tag that does not match the tree is a release whose artefacts cannot
        # be matched back to their source.
        run: |
          tag="${GITHUB_REF_NAME}"
          file="$(tr -d '\n' < .release-version)"
          [ "$tag" = "$file" ] || {
            echo "tag $tag does not match .release-version $file"
            exit 1
          }
          echo "tag and .release-version agree at $tag"

  # ── Build every target the project claims to support ───────────────────────
  build:
    name: "Release · ${{ matrix.target }}"
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        # --locked so the release resolves exactly the dependency graph that was
        # reviewed, and remapped paths so the build directory does not leak into
        # the artefact and break reproducibility.
        env:
          RUSTFLAGS: "-D warnings --remap-path-prefix=${{ github.workspace }}=/build"
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: Collect and checksum
        run: |
          mkdir -p dist
          found=0
          while IFS= read -r f; do
            cp "$f" "dist/$(basename "${f%.rlib}")-${{ matrix.target }}.rlib"
            found=1
          done < <(find "target/${{ matrix.target }}/release" -maxdepth 1 -name 'libvayucell*.rlib')
          [ "$found" = "1" ] || { echo "no artefact produced for ${{ matrix.target }}"; exit 1; }
          ( cd dist && sha256sum ./* > "SHA256SUMS-${{ matrix.target }}.txt" )
          cat "dist/SHA256SUMS-${{ matrix.target }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # ── Sign and publish ───────────────────────────────────────────────────────
  publish:
    name: "Release · Sign and publish"
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Job-scoped, and this is the floor rather than a preference: creating a
    # release IS a write to repository contents, and keyless signing IS the
    # exchange of an OIDC identity token. A supply-chain scanner will report
    # both as write permissions and it is right to; the answer is that they are
    # confined to the one job that publishes, and every other job in this
    # workflow inherits the top-level `contents: read`.
    permissions:
      contents: write   # to create the release
      id-token: write   # for keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: staging
      - name: Flatten and re-checksum
        run: |
          mkdir -p dist
          find staging -type f ! -name 'SHA256SUMS-*' -exec cp {} dist/ \;
          ( cd dist && sha256sum ./* > SHA256SUMS.txt )
          cat dist/SHA256SUMS.txt

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the checksum file
        # One signature over the checksum file rather than one per artefact:
        # the checksums already bind every file, and a verifier has one thing to
        # check instead of a list they might not finish.
        run: |
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.txt.sig \
            --output-certificate dist/SHA256SUMS.txt.pem \
            dist/SHA256SUMS.txt

      - name: Generate the SBOM
        # No `|| true`. A release that silently ships without its bill of
        # materials is the unverifiable artefact this workflow exists to
        # prevent, and swallowing the error is how that happens quietly.
        run: |
          cargo install cargo-cyclonedx --locked
          bash scripts/sbom.sh dist/sbom.cdx.json
          ls -la dist/

      - name: How to verify this release
        run: |
          {
            echo "## Verifying this release"
            echo
            echo '```bash'
            echo "cosign verify-blob \\"
            echo "  --certificate SHA256SUMS.txt.pem \\"
            echo "  --signature SHA256SUMS.txt.sig \\"
            echo "  --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  SHA256SUMS.txt"
            echo
            echo "sha256sum -c SHA256SUMS.txt"
            echo '```'
            echo
            echo "The certificate is keyless and bound to this workflow. There is no"
            echo "private key to steal, and nothing to trust that you cannot check."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
