# SPDX-License-Identifier: Apache-2.0
#
# Auto-merge Dependabot's SAFE updates — patch and minor only.
#
# "Auto-merge" does not merge immediately. GitHub merges once the required
# checks pass, so the full gate still runs on every update and nothing broken
# can land. Major bumps are deliberately left for a person, because a major is a
# behaviour change wearing a version number.
#
# The attribution gate exempts dependabot[bot] from the human-author rule for
# exactly this flow: the accountable act is the review and the merge, and the
# merge is what this automates once CI has spoken.

name: Dependabot auto-merge

on: pull_request

# Nothing at the top level. A workflow-wide `contents: write` grants that token
# to every job it will ever gain, including one added later by somebody who did
# not read this header — and this workflow runs on `pull_request`, where the
# branch is proposed by whoever opened it.
permissions: {}

jobs:
  automerge:
    name: Enable auto-merge for patch and minor bumps
    runs-on: ubuntu-24.04
    if: ${{ github.actor == 'dependabot[bot]' }}
    # Scoped to the one job that needs it, and to the two scopes it needs.
    # `contents: write` is what queues the merge; `pull-requests: write` is what
    # sets auto-merge on the pull request itself.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        id: meta
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-minor' || steps.meta.outputs.update-type == 'version-update:semver-patch' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Say why a major was left alone
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-major' }}
        run: |
          echo "Major bump (${{ steps.meta.outputs.dependency-names }}) left for a person." \
            >> "$GITHUB_STEP_SUMMARY"
