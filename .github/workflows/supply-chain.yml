# SPDX-License-Identifier: Apache-2.0
#
# Supply chain: what is in the artefact, and what is known about it.
#
# The core is required to carry no third-party runtime dependencies (ADR-0005
# §5.1, Charter Article V.5). These jobs exist so that claim is checkable by
# somebody who does not take our word for it, and so the day it stops being true
# is a day something goes red rather than a day nobody notices.

name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"   # Monday 04:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:

  sbom:
    name: "SBOM (CycloneDX)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Generate
        run: |
          cargo install cargo-cyclonedx --locked
          bash scripts/sbom.sh sbom.cdx.json
      - name: The dependency count must match the charter's claim
        # Article V.5 and ADR-0005 §5.1: zero third-party runtime dependencies.
        # An SBOM nobody asserts anything about is a file, not a check.
        run: |
          python3 - <<'PY'
          import json, sys
          doc = json.load(open("sbom.cdx.json"))
          third_party = [
              c for c in doc.get("components", [])
              if not str(c.get("name", "")).startswith("vayucell")
          ]
          for c in third_party:
              print(f"  third-party: {c.get('name')} {c.get('version')}")
          if third_party:
              print()
              print("The core has taken a third-party runtime dependency. That needs an")
              print("ADR admitting it, and deny.toml reviewed, before this can go green.")
              sys.exit(1)
          print("no third-party runtime components — the charter's claim holds")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json

  osv:
    name: "OSV scan"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Scan the lockfile against the OSV database
        # A second opinion alongside cargo-deny's advisories check. They draw on
        # overlapping but not identical data, and two sources disagreeing is
        # itself information worth having.
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=./Cargo.lock

  scorecard:
    name: "OpenSSF Scorecard"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Only on main: the scan grades repository settings, which a pull request
    # branch cannot change and should not be judged on.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Say which token this scan is using, and what that costs
        # Branch-Protection is the one check that cannot be answered from the
        # tree: Scorecard has to *read the repository's settings*, and the
        # default GITHUB_TOKEN cannot. Without a token carrying
        # `Administration: read` the check scores 0 whatever the repository is
        # actually configured to do — so a maintainer who turns protection on
        # and watches the alert stay open has been told nothing useful.
        #
        # That is exactly the failure this project exists to refuse: a red row
        # that means "not checked" while reading as "checked and failing". It is
        # said out loud on every run rather than left to be discovered.
        env:
          HAS_TOKEN: ${{ secrets.SCORECARD_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "SCORECARD_TOKEN is set: Branch-Protection is being genuinely evaluated."
          else
            echo "SCORECARD_TOKEN is NOT set."
            echo
            echo "  Branch-Protection will report 0 because this scan cannot read the"
            echo "  repository's settings — not because protection is absent. The two"
            echo "  are indistinguishable in the output, which is why this notice exists."
            echo
            echo "  To make the check mean something, add a fine-grained personal access"
            echo "  token with 'Administration: read' on this repository as the secret"
            echo "  SCORECARD_TOKEN. Nothing else in this workflow needs it, and no other"
            echo "  check changes."
          fi

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
          # Falls back to the job's own token when the secret is absent, so the
          # scan still runs and every other check is still scored. The fallback
          # is the current behaviour, made visible rather than implicit.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: scorecard.sarif
        continue-on-error: true
